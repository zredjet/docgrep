[package]
name = "docgrep"
version = "0.1.0"
edition = "2024"
# let-chains in edition 2024
rust-version = "1.88"
description = "Exact-match search inside Word / Excel files from the console"
readme = "README.md"
keywords = ["grep", "docx", "xlsx", "search", "japanese"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
calamine = "0.36.1"
clap = { version = "4.6.7", features = ["derive"] }
fancy-regex = "0.19.2"
glob = "0.3.4"
quick-xml = "0.42.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
unicode-width = "0.2.2"
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.48.0"
predicates = "3.1.4"
rust_xlsxwriter = "0.99.1"
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
